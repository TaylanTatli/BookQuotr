name: Release & Docker Image

# Runs after CI finishes on master. Ordinary pushes run CI only; a Docker image
# is published only when the version in package.json has no matching tag yet,
# i.e. when a new version is actually being released.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    name: Publish release and Docker image
    runs-on: ubuntu-latest
    # Never publish unless the triggering CI run succeeded for a master push.
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      packages: write

    steps:
      # Check out the exact commit CI validated, so the tag and image match it.
      - name: Checkout the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.get_version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.get_version.outputs.tag }} already exists — nothing to release."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag does not exist — proceeding with release."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Build and push the image BEFORE creating the release: a failed Docker
      # build must not leave a successful GitHub Release behind.
      - name: Log in to the Container registry
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: steps.check_tag.outputs.exists == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.get_version.outputs.version }}

      - name: Set up Docker Buildx
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Changelog
        if: steps.check_tag.outputs.exists == 'false'
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s" "$PREV_TAG"..HEAD)
          fi

          FEATURES=$(echo "$COMMITS" | grep -E "^feat(\(.+\))?!?:" | sed 's/^feat[^:]*: //' | sed 's/^/- /' || true)
          FIXES=$(echo "$COMMITS" | grep -E "^fix(\(.+\))?!?:" | sed 's/^fix[^:]*: //' | sed 's/^/- /' || true)
          REFACTORS=$(echo "$COMMITS" | grep -E "^refactor(\(.+\))?!?:" | sed 's/^refactor[^:]*: //' | sed 's/^/- /' || true)
          STYLES=$(echo "$COMMITS" | grep -E "^(style|ui)(\(.+\))?!?:" | sed 's/^[^:]*: //' | sed 's/^/- /' || true)
          CHORES=$(echo "$COMMITS" | grep -E "^(chore|build|ci)(\(.+\))?!?:" | sed 's/^[^:]*: //' | sed 's/^/- /' || true)
          OTHERS=$(echo "$COMMITS" | grep -vE "^(feat|fix|refactor|style|ui|chore|build|ci)(\(.+\))?!?:" | sed 's/^/- /' || true)

          NOTES=""
          [ -n "$FEATURES" ]  && NOTES="${NOTES}## 🚀 Features\n${FEATURES}\n\n"
          [ -n "$FIXES" ]     && NOTES="${NOTES}## 🐛 Bug Fixes\n${FIXES}\n\n"
          [ -n "$REFACTORS" ] && NOTES="${NOTES}## ♻️ Refactors\n${REFACTORS}\n\n"
          [ -n "$STYLES" ]    && NOTES="${NOTES}## 🎨 Styles & UI\n${STYLES}\n\n"
          [ -n "$CHORES" ]    && NOTES="${NOTES}## 🔧 Chores\n${CHORES}\n\n"
          [ -n "$OTHERS" ]    && NOTES="${NOTES}## 📝 Other Changes\n${OTHERS}\n\n"

          if [ -n "$PREV_TAG" ]; then
            NOTES="${NOTES}**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.get_version.outputs.tag }}"
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "notes<<$EOF" >> "$GITHUB_OUTPUT"
          echo -e "$NOTES" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          body: ${{ steps.changelog.outputs.notes }}
